<!doctype html>
<html lang="en" data-theme="parchment">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manuscriptic</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      [data-theme="parchment"] {
        color-scheme: light;
        --room: #e5dccb;
        --faded: #8a7b68;
        --rule: #e3d6c2;
        --nib: #7c3b2e;
      }
      [data-theme="ink"] {
        color-scheme: dark;
        --room: #10141c;
        --faded: #8e98ab;
        --rule: #2a3344;
        --nib: #d4b483;
      }
      body {
        background: var(--room);
      }
      .opening {
        box-sizing: border-box;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: var(--faded);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .opening p {
        margin: 0;
        font-size: 0.95rem;
      }
      .opening-track {
        width: 8.5rem;
        height: 2px;
        overflow: hidden;
        background: var(--rule);
        border-radius: 1px;
      }
      .opening-track span {
        display: block;
        height: 100%;
        width: 38%;
        background: var(--nib);
        animation: opening-slide 1.05s ease-in-out infinite;
      }
      @keyframes opening-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(280%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .opening-track span {
          width: 100%;
          animation: none;
        }
      }
    </style>
    <script>
      try {
        var savedTheme = localStorage.getItem("manuscriptic-theme");
        if (savedTheme && /^[a-z0-9-]+$/.test(savedTheme)) {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch {}
    </script>
  </head>

  <body>
    <div id="root">
      <div class="opening" role="status" aria-live="polite">
        <div class="opening-track" aria-hidden="true"><span></span></div>
        <p>Opening…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
