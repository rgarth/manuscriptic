name: Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: amd64
          - platform: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:build:appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Manuscriptic-linux-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          pattern: Manuscriptic-linux-*
          path: dist
          merge-multiple: true

      - name: Attach AppImages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find dist -print
          mapfile -t files < <(find dist -type f -name '*.AppImage' | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No AppImages were built."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "${tag#v}" \
              --generate-notes
          fi
